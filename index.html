<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUPERNOVA: Stage Survivors</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700;800;900&family=Press+Start+2P&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-void: #0A0A14;
            --panel: #1A1630;
            --text-primary: #FFF6FF;
            --brand-pink: #FF79C6;
            --brand-cyan: #6DE6FF;
        }
        body {
            background: var(--bg-void);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }
        #wrap {
            position: relative;
            width: 960px;
            height: 720px;
        }
        #gameCanvas, #uiCanvas {
            position: absolute;
            top: 0; left: 0;
            width: 960px;
            height: 720px;
            border: none;
            border-radius: 0;
        }
        #gameCanvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        #uiCanvas {
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="wrap">
        <canvas id="gameCanvas"></canvas>
        <canvas id="uiCanvas"></canvas>
    </div>
    <script src="content/game_content.js?v=2"></script>
    <script src="game.js?v=2"></script>
</body>
</html>
