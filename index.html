<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUPERNOVA: Stage Survivors</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a0a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: monospace;
            image-rendering: pixelated;
        }
        canvas {
            display: block;
            image-rendering: pixelated;

            border: 2px solid #ff44aa;
            box-shadow: 0 0 40px rgba(255, 68, 170, 0.4), 0 0 80px rgba(100, 50, 255, 0.2);
        }
    </style>

    <canvas id="gameCanvas"></canvas>
