<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ SUPERNOVA: Stage Survivors ✨</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Press+Start+2P&family=Outfit:wght@400;600;700;800;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0015;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Press Start 2P', monospace;
        }
        #wrap {
            position: relative;
            width: 960px;
            height: 720px;
        }
        #gameCanvas, #uiCanvas {
            position: absolute;
            top: 0; left: 0;
            width: 960px;
            height: 720px;
            border: 2px solid transparent;
            border-image: linear-gradient(135deg, #ff2d78, #8b5cf6, #22d3ee, #ff2d78) 1;
            box-shadow: 0 0 80px rgba(255,45,120,0.4), 0 0 160px rgba(139,92,246,0.25), inset 0 0 80px rgba(255,45,120,0.08);
            border-radius: 0px;
        }
        #gameCanvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        #uiCanvas {
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="wrap">
        <canvas id="gameCanvas"></canvas>
        <canvas id="uiCanvas"></canvas>
    </div>
    <script src="game.js"></script>
</body>
</html>
